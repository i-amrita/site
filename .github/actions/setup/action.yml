name: Setup
description: Install Node (from .nvmrc) and pnpm (from package.json packageManager), then install dependencies with a frozen lockfile.
runs:
  using: composite
  steps:
    # No `version` input: pnpm/action-setup reads `packageManager` (pnpm@12.14.0) so CI always matches local.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
