name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      # Advisory until a locale flips on. Absent config or missing translations never block a merge.
      - name: intl-ai check (advisory)
        continue-on-error: true
        run: pnpm intl-ai:check

  build:
    name: Build and link audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      # Internal links, assets, anchors, case mismatches. External links are not fetched, so placeholders cannot fail CI.
      - name: Link audit
        run: pnpm audit:links
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3
          if-no-files-found: error

  post-audit:
    name: Post-build SEO audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Builds with astro.audit.config.mjs (astro-post-audit integration). Only errors fail; warnings stay in the log.
      - run: pnpm audit:site

  e2e:
    name: E2E and a11y
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v2-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and WebKit with system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Install system deps only (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit
      # Playwright starts `pnpm preview` on :4322 against the downloaded dist/ (webServer in tests/playwright.config.ts).
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
