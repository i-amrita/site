# lefthook config: runs on every commit + push.
# Pre-commit = fast feedback on staged files.
# Pre-push = full gate (build + pagefind; e2e and link audit join as they land).

pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: '**/*.{ts,tsx,js,jsx,astro,json,css,yaml,yml,toml}'
      exclude: '(^|/)(mise\.toml|pnpm-lock\.yaml)$|^src/components/ui/|^src/i18n/paraglide/'
      run: 'pnpm exec oxfmt --write {staged_files}'
      stage_fixed: true
    oxlint:
      glob: '**/*.{ts,tsx,js,jsx,astro}'
      exclude: '^src/components/ui/|^src/i18n/paraglide/'
      run: 'pnpm exec oxlint {staged_files}'
    astro-check:
      glob: '**/*.{astro,ts,tsx}'
      run: 'pnpm exec astro check'

commit-msg:
  commands:
    commitlint:
      run: 'pnpm exec commitlint --edit {1}'

pre-push:
  parallel: true
  commands:
    build:
      run: 'pnpm build'
    # link-audit and e2e need dist/ from `build`, and pre-push runs in parallel, so they would race it.
    # CI runs both (see .github/workflows/ci.yml). Run locally with: pnpm build && pnpm audit:links && SKIP_BUILD=1 pnpm test:e2e
    # link-audit:
    #   run: 'pnpm audit:links'
    intl-check:
      run: 'pnpm exec intl-ai check'
